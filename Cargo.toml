[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.90"
authors = ["Şeref Çimen"]
license = "UNLICENSED"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
float_cmp = "warn"
large_futures = "warn"

[workspace.dependencies]
# internal
bb-core = { path = "crates/bb-core" }
bb-binance = { path = "crates/bb-binance" }
bb-omp = { path = "crates/bb-omp" }
bb-social = { path = "crates/bb-social" }
bb-pool = { path = "crates/bb-pool" }
bb-trader = { path = "crates/bb-trader" }
bb-strategies = { path = "crates/bb-strategies" }
bb-runtime = { path = "crates/bb-runtime" }
bb-products = { path = "crates/bb-products" }
bb-capital = { path = "crates/bb-capital" }
bb-listing = { path = "crates/bb-listing" }
bb-signals = { path = "crates/bb-signals" }
bb-sniper = { path = "crates/bb-sniper" }
bb-airdrop = { path = "crates/bb-airdrop" }
bb-polymarket = { path = "crates/bb-polymarket" }

# runtime
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
futures = "0.3"
async-trait = "0.1"

# http / ws
reqwest = { version = "0.13", features = ["json", "gzip", "query", "form"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
url = "2"

# data
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
rust_decimal = { version = "1", features = ["serde-with-str", "serde-with-arbitrary-precision", "maths"] }
rust_decimal_macros = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "v7", "serde"] }
csv = "1"
rusqlite = { version = "0.40", features = ["bundled"] }

# crypto / encoding
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
bs58 = "0.5"
ed25519-dalek = { version = "2", features = ["pkcs8", "rand_core"] }
rand = "0.8"

# errors / logging / cli
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
clap = { version = "4", features = ["derive", "env"] }
dotenvy = "0.15"
html-escape = "0.2"

# testing
tempfile = "3"
wiremock = "0.6"
pretty_assertions = "1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[profile.dev.package."*"]
opt-level = 1
