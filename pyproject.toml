[project]
name = "binance-bot"
version = "0.1.0"
description = "A Binance trading bot using ccxt"
authors = [
    { name = "Şeref Çimen" }
]
dependencies = [
    "ccxt",
    "python-dotenv",
    "aiohttp",
    "pydantic",
    "pydantic-settings",
    "loguru",
    "solders"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-mock"
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
