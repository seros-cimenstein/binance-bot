<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="light dark">
<title>cryptobot</title>
<style>
  :root {
    --bg: #f5f6f8; --surface: #fff; --surface-2: #f1f3f6; --fg: #14171c; --muted: #687080; --faint: #9aa1ad;
    --border: #e4e7ec; --accent: #4f46e5; --accent-soft: rgba(79, 70, 229, .1);
    --pos: #12965a; --pos-soft: rgba(18, 150, 90, .12); --neg: #d9363e; --neg-soft: rgba(217, 54, 62, .11);
    --warn: #b7791f; --warn-soft: rgba(183, 121, 31, .13);
    --shadow: 0 1px 2px rgba(16, 24, 40, .04), 0 1px 3px rgba(16, 24, 40, .06);
    --c1: #4f46e5; --c2: #0ea5e9; --c3: #14b8a6; --c4: #f59e0b; --c5: #ec4899; --c6: #94a3b8;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0b0d12; --surface: #13161d; --surface-2: #1a1e27; --fg: #e7e9ee; --muted: #9198a5; --faint: #5f6673;
      --border: #242934; --accent: #8b93fb; --accent-soft: rgba(139, 147, 251, .14);
      --pos: #34d27b; --pos-soft: rgba(52, 210, 123, .13); --neg: #f87171; --neg-soft: rgba(248, 113, 113, .13);
      --warn: #fbbf24; --warn-soft: rgba(251, 191, 36, .13); --shadow: none;
      --c1: #8b93fb; --c2: #38bdf8; --c3: #2dd4bf; --c4: #fbbf24; --c5: #f472b6; --c6: #64748b;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--bg); color: var(--fg); font: 14px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
         -webkit-font-smoothing: antialiased; }
  button { font: inherit; color: inherit; }
  .num { font-variant-numeric: tabular-nums; }
  .muted { color: var(--muted); } .faint { color: var(--faint); }
  .pos { color: var(--pos); } .neg { color: var(--neg); } .warn { color: var(--warn); }
  .small { font-size: 12px; }

  /* top bar */
  .top { position: sticky; top: 0; z-index: 10; background: color-mix(in srgb, var(--bg) 85%, transparent);
         backdrop-filter: blur(10px); border-bottom: 1px solid var(--border); }
  .top-inner { max-width: 1240px; margin: 0 auto; padding: 0 20px; display: flex; align-items: center; gap: 20px; height: 56px; }
  .brand { display: flex; align-items: center; gap: 8px; font-weight: 650; letter-spacing: -.01em; white-space: nowrap; }
  .brand .mark { width: 22px; height: 22px; border-radius: 6px; background: linear-gradient(135deg, var(--accent), var(--c2)); }
  .tabs { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; flex: 1; }
  .tabs a { padding: 6px 12px; border-radius: 8px; color: var(--muted); text-decoration: none; font-weight: 500; white-space: nowrap; }
  .tabs a:hover { color: var(--fg); background: var(--surface-2); }
  .tabs a[aria-current="page"] { color: var(--fg); background: var(--surface); box-shadow: var(--shadow); outline: 1px solid var(--border); }
  .top-right { display: flex; align-items: center; gap: 12px; white-space: nowrap; }
  .icon-btn { border: 1px solid var(--border); background: var(--surface); border-radius: 8px; width: 32px; height: 32px; cursor: pointer;
              display: grid; place-items: center; color: var(--muted); }
  .icon-btn:hover { color: var(--fg); }
  .icon-btn.spin svg { animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .status { display: inline-flex; align-items: center; gap: 7px; padding: 4px 10px; border-radius: 999px; font-weight: 600; font-size: 12px;
            background: var(--surface-2); color: var(--muted); }
  .status .dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
  .status.pos { background: var(--pos-soft); color: var(--pos); }
  .status.pos .dot { box-shadow: 0 0 0 0 currentColor; animation: pulse 2s infinite; }
  .status.neg { background: var(--neg-soft); color: var(--neg); }
  .status.warn { background: var(--warn-soft); color: var(--warn); }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, currentColor 50%, transparent); } 70% { box-shadow: 0 0 0 6px transparent; } 100% { box-shadow: 0 0 0 0 transparent; } }

  main { max-width: 1240px; margin: 0 auto; padding: 20px; display: grid; gap: 16px; }
  .page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .page-head h1 { font-size: 20px; margin: 0; letter-spacing: -.02em; }
  .page-head p { margin: 2px 0 0; color: var(--muted); }

  .alerts { display: grid; gap: 8px; }
  .alert { display: flex; gap: 10px; align-items: flex-start; padding: 10px 14px; border-radius: 10px; border: 1px solid; }
  .alert.neg { background: var(--neg-soft); border-color: color-mix(in srgb, var(--neg) 35%, transparent); color: var(--neg); }
  .alert.warn { background: var(--warn-soft); border-color: color-mix(in srgb, var(--warn) 35%, transparent); color: var(--warn); }
  .alert b { display: block; }
  .alert span { color: var(--fg); opacity: .85; }

  .grid { display: grid; gap: 16px; }
  .kpis { grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); }
  .split { grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); }
  .halves { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  @media (max-width: 900px) { .split, .halves { grid-template-columns: minmax(0, 1fr); } }

  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; box-shadow: var(--shadow); min-width: 0; }
  .card-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 14px 16px 0; }
  .card-head h2 { margin: 0; font-size: 14px; font-weight: 600; }
  .card-head .hint { color: var(--muted); font-size: 12px; }
  .card-body { padding: 12px 16px 16px; }
  .card-body.flush { padding: 8px 0 4px; }

  .kpi { padding: 14px 16px; }
  .kpi .label { color: var(--muted); font-size: 12px; font-weight: 500; display: flex; align-items: center; gap: 6px; }
  .kpi .value { font-size: 26px; font-weight: 650; letter-spacing: -.02em; margin-top: 4px; line-height: 1.15; }
  .kpi .sub { color: var(--muted); font-size: 12px; margin-top: 4px; }
  .kpi .sub b { font-weight: 600; }

  .chip { display: inline-flex; align-items: center; gap: 5px; padding: 1px 8px; border-radius: 999px; font-size: 12px; font-weight: 600;
          background: var(--surface-2); color: var(--muted); white-space: nowrap; }
  .chip.pos { background: var(--pos-soft); color: var(--pos); }
  .chip.neg { background: var(--neg-soft); color: var(--neg); }
  .chip.warn { background: var(--warn-soft); color: var(--warn); }
  .chip.accent { background: var(--accent-soft); color: var(--accent); }

  .seg { display: inline-flex; background: var(--surface-2); border-radius: 9px; padding: 3px; gap: 2px; }
  .seg button { border: 0; background: transparent; padding: 4px 12px; border-radius: 7px; cursor: pointer; color: var(--muted); font-weight: 500; }
  .seg button[aria-pressed="true"] { background: var(--surface); color: var(--fg); box-shadow: var(--shadow); }

  .toggle { display: inline-flex; align-items: center; gap: 8px; color: var(--muted); font-size: 12px; cursor: pointer; user-select: none; }

  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 9px 16px; border-top: 1px solid var(--border); vertical-align: middle; }
  thead th { border-top: 0; color: var(--muted); font-weight: 500; font-size: 12px; white-space: nowrap; padding-top: 4px; padding-bottom: 6px; }
  td.r, th.r { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  td.nw { white-space: nowrap; }
  tr.click { cursor: pointer; }
  tr.click:hover td { background: var(--surface-2); }
  tr.detail td { background: var(--surface-2); border-top: 0; padding-top: 2px; }
  .table-wrap { overflow-x: auto; }
  .asset { display: inline-flex; align-items: center; gap: 8px; font-weight: 600; }
  .coin { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-size: 10px; font-weight: 700; color: #fff; flex: none; }
  .route { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
  .route .arrow { color: var(--faint); }
  .bar-cell { display: flex; align-items: center; gap: 8px; justify-content: flex-end; }
  .bar-track { width: 80px; height: 6px; border-radius: 3px; background: var(--surface-2); overflow: hidden; flex: none; }
  .bar-fill { height: 100%; border-radius: 3px; background: var(--accent); }
  .bar-fill.pos { background: var(--pos); } .bar-fill.neg { background: var(--neg); }

  .empty { padding: 28px 16px; text-align: center; color: var(--muted); }
  .empty b { display: block; color: var(--fg); font-weight: 600; margin-bottom: 2px; }
  .error-box { padding: 12px 16px; color: var(--neg); }

  .chart { width: 100%; min-height: 40px; }
  .chart svg { display: block; overflow: visible; }
  .chart .grid-line { stroke: var(--border); stroke-dasharray: 2 4; }
  .chart .zero { stroke: var(--faint); }
  .chart .axis { fill: var(--faint); font-size: 11px; }
  .chart .line { fill: none; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
  .chart .line.pos { stroke: var(--pos); } .chart .line.neg { stroke: var(--neg); }
  .chart .area.pos { fill: var(--pos-soft); } .chart .area.neg { fill: var(--neg-soft); }
  .chart .dot { stroke: var(--surface); stroke-width: 1.5; fill: var(--faint); }
  .chart .dot.pos { fill: var(--pos); } .chart .dot.neg { fill: var(--neg); } .chart .dot.accent { fill: var(--accent); }
  .chart .bar.pos { fill: var(--pos); } .chart .bar.neg { fill: var(--neg); } .chart .bar.muted { fill: var(--faint); }
  .chart .bar.accent { fill: var(--accent); }
  .chart .bar:hover { opacity: .8; }
  .chart .guide { stroke: var(--faint); stroke-dasharray: 3 3; }

  .donut { display: flex; align-items: center; gap: 20px; flex-wrap: wrap; justify-content: center; }
  .donut svg circle.seg-arc { transition: stroke-width .15s; cursor: default; }
  .donut svg circle.seg-arc:hover { stroke-width: 22; }
  .legend { display: grid; gap: 6px; min-width: 150px; flex: 1; }
  .legend-row { display: flex; align-items: center; gap: 8px; font-size: 13px; }
  .legend-row .sw { width: 10px; height: 10px; border-radius: 3px; flex: none; }
  .legend-row .lv { margin-left: auto; font-variant-numeric: tabular-nums; color: var(--muted); }

  .checks { display: grid; gap: 2px; }
  .check { display: flex; gap: 12px; align-items: flex-start; padding: 10px 16px; border-top: 1px solid var(--border); }
  .check:first-child { border-top: 0; }
  .check .ic { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; flex: none; font-size: 13px; font-weight: 700; margin-top: 1px; }
  .check .ic.pos { background: var(--pos-soft); color: var(--pos); }
  .check .ic.neg { background: var(--neg-soft); color: var(--neg); }
  .check .ic.warn { background: var(--warn-soft); color: var(--warn); }
  .check .ic.muted { background: var(--surface-2); color: var(--muted); }
  .check .t { font-weight: 600; }
  .check .d { color: var(--muted); font-size: 12px; }

  .facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px 20px; }
  .fact .k { color: var(--muted); font-size: 12px; }
  .fact .v { font-weight: 600; margin-top: 1px; word-break: break-word; }

  .feed { display: grid; }
  .feed-item { padding: 12px 16px; border-top: 1px solid var(--border); display: grid; gap: 6px; }
  .feed-item:first-child { border-top: 0; }
  .feed-meta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
  .feed-meta .sep { color: var(--faint); }
  .feed-text { white-space: pre-wrap; word-break: break-word; }
  .clamp { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; cursor: pointer; }

  .quote { padding: 14px 16px; border-left: 3px solid var(--accent); background: var(--accent-soft); border-radius: 0 10px 10px 0;
           white-space: pre-wrap; word-break: break-word; }

  .footnote { color: var(--muted); font-size: 12px; }
  details.footnote summary { cursor: pointer; color: var(--accent); }
  details.footnote p { margin: 6px 0 0; max-width: 820px; }

  .tip { position: fixed; z-index: 50; pointer-events: none; background: var(--fg); color: var(--bg); padding: 7px 10px; border-radius: 8px;
         font-size: 12px; max-width: 280px; box-shadow: 0 6px 20px rgba(0, 0, 0, .18); }
  .tip .tt { font-weight: 650; margin-bottom: 2px; }
  .skeleton { height: 120px; border-radius: 14px; background: linear-gradient(90deg, var(--surface) 0%, var(--surface-2) 50%, var(--surface) 100%);
              background-size: 200% 100%; animation: shimmer 1.4s infinite; border: 1px solid var(--border); }
  @keyframes shimmer { to { background-position: -200% 0; } }
  @media (max-width: 640px) {
    .top-inner { flex-wrap: wrap; height: auto; gap: 6px 10px; padding: 8px 12px 0; }
    .tabs { order: 3; flex-basis: 100%; padding-bottom: 8px; }
    .top-right { margin-left: auto; }
    #updated { display: none; }
    main { padding: 14px 12px; }
    th, td { padding: 8px 10px; }
    .kpi .value { font-size: 22px; }
  }
</style>
</head>
<body>
<header class="top">
  <div class="top-inner">
    <div class="brand"><span class="mark"></span><span class="name">cryptobot</span></div>
    <nav class="tabs" id="tabs">
      <a href="#overview" data-tab="overview">Overview</a>
      <a href="#history" data-tab="history">History</a>
      <a href="#wallet" data-tab="wallet">Wallet</a>
      <a href="#claude" data-tab="claude">Claude</a>
      <a href="#fleet" data-tab="fleet">Fleet</a>
    </nav>
    <div class="top-right">
      <span class="status" id="status-pill" title=""><span class="dot"></span><span>…</span></span>
      <span class="small faint" id="updated"></span>
      <button class="icon-btn" id="refresh" type="button" title="Refresh now" aria-label="Refresh now">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
      </button>
    </div>
  </div>
</header>
<main id="view"></main>
<div class="tip" id="tip" hidden></div>
<script>
"use strict";
// Everything that comes from the bot (including Claude- and web-derived text) is inserted with
// textContent / createTextNode; nothing is parsed as HTML.
const REFRESH_MS = 30000;
const DUST_USDT = 1;
const TABS = ["overview", "history", "wallet", "claude", "fleet"];
const ENDPOINTS = { status: "/api/status", history: "/api/history", wallet: "/api/wallet", fleet: "/api/fleet" };
const SVGNS = "http://www.w3.org/2000/svg";
const PALETTE = ["var(--c1)", "var(--c2)", "var(--c3)", "var(--c4)", "var(--c5)", "var(--c6)"];

const ui = { tab: "overview", range: "all", hideDust: true, expanded: new Set(), data: {}, errors: {}, loadedAt: null, loading: false };

// ---------- DOM helpers ----------
function el(tag, attrs, ...kids) {
  const node = document.createElement(tag);
  for (const [key, value] of Object.entries(attrs || {})) {
    if (value === null || value === undefined || value === false) continue;
    if (key.startsWith("on")) node.addEventListener(key.slice(2), value);
    else if (key === "class") node.className = value;
    else node.setAttribute(key, value === true ? "" : value);
  }
  append(node, kids);
  return node;
}
function append(node, kids) {
  for (const kid of kids.flat(Infinity)) {
    if (kid === null || kid === undefined || kid === false) continue;
    node.append(kid instanceof Node ? kid : document.createTextNode(String(kid)));
  }
}
function sv(tag, attrs, ...kids) {
  const node = document.createElementNS(SVGNS, tag);
  for (const [key, value] of Object.entries(attrs || {})) {
    if (value === null || value === undefined) continue;
    node.setAttribute(key, value);
  }
  for (const kid of kids.flat()) {
    if (kid === null || kid === undefined) continue;
    if (kid instanceof Node) node.append(kid); else node.textContent = String(kid);
  }
  return node;
}

// ---------- formatting ----------
const fmtCache = new Map();
function nf(min, max) {
  const key = min + ":" + max;
  if (!fmtCache.has(key)) fmtCache.set(key, new Intl.NumberFormat(undefined, { minimumFractionDigits: min, maximumFractionDigits: max }));
  return fmtCache.get(key);
}
function num(v) { const n = typeof v === "number" ? v : parseFloat(v); return Number.isFinite(n) ? n : null; }
function usd(v, opts = {}) {
  const n = num(v);
  if (n === null) return "—";
  const a = Math.abs(n);
  const dp = a >= 1000 ? 0 : a >= 1 || a === 0 ? 2 : a >= 0.01 ? 3 : 4;
  const body = "$" + nf(dp, dp).format(a);
  if (n < 0 && a >= 0.00005) return "−" + body;
  return (opts.sign && n > 0 ? "+" : "") + body;
}
function pct(v, opts = {}) {
  const n = num(v);
  if (n === null) return "—";
  const dp = opts.dp ?? 2;
  const sign = opts.sign === false ? "" : n > 0 ? "+" : n < 0 ? "−" : "";
  return sign + nf(dp, dp).format(Math.abs(n)) + "%";
}
function qty(v) {
  const n = num(v);
  if (n === null) return "—";
  const a = Math.abs(n);
  return nf(0, a >= 1000 ? 2 : a >= 1 ? 4 : 8).format(n);
}
function tone(v) { const n = num(v); return n === null || n === 0 ? "muted" : n > 0 ? "pos" : "neg"; }
function ms(iso) { const t = Date.parse(iso); return Number.isFinite(t) ? t : null; }
function ago(iso) {
  const t = ms(iso);
  if (t === null) return "—";
  const s = Math.max(0, (Date.now() - t) / 1000);
  if (s < 45) return "just now";
  if (s < 3600) return Math.round(s / 60) + "m ago";
  if (s < 86400) return Math.round(s / 3600) + "h ago";
  return Math.round(s / 86400) + "d ago";
}
function stamp(iso) {
  const t = ms(iso);
  return t === null ? "—" : new Date(t).toLocaleString(undefined, { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" });
}
function shortDate(iso) {
  const t = ms(iso);
  return t === null ? "" : new Date(t).toLocaleDateString(undefined, { month: "short", day: "numeric" });
}
function dayKey(t) {
  const d = new Date(t);
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
}
function duration(sec) {
  if (sec === null || sec === undefined) return "—";
  let s = Math.max(0, Math.round(sec));
  if (s < 60) return s + "s";
  const m = Math.floor(s / 60);
  if (m < 60) return m + "m";
  const h = Math.floor(m / 60);
  if (h < 48) return h + "h " + (m % 60) + "m";
  return Math.floor(h / 24) + "d " + (h % 24) + "h";
}
function pretty(name) { return String(name || "").replace(/_/g, " ").replace(/\b\w/g, (c) => c.toUpperCase()); }

// ---------- small components ----------
function card(title, body, opts = {}) {
  return el("section", { class: "card" },
    title || opts.action ? el("div", { class: "card-head" }, el("h2", null, title), opts.action || (opts.hint ? el("span", { class: "hint" }, opts.hint) : null)) : null,
    el("div", { class: "card-body" + (opts.flush ? " flush" : "") }, body));
}
function kpi(label, value, sub, valueTone) {
  return el("div", { class: "card kpi" },
    el("div", { class: "label" }, label),
    el("div", { class: "value num" + (valueTone ? " " + valueTone : "") }, value),
    sub ? el("div", { class: "sub" }, sub) : null);
}
function chip(text, t) { return el("span", { class: "chip " + (t || "") }, text); }
function empty(title, text) { return el("div", { class: "empty" }, el("b", null, title), text); }
function errorBox(text) { return el("div", { class: "error-box" }, text); }
function signed(v, fmt = usd) { return el("span", { class: tone(v) + " num" }, fmt(v, { sign: true })); }
function coinColor(asset) {
  let h = 0;
  for (const c of String(asset)) h = (h * 31 + c.charCodeAt(0)) >>> 0;
  return "hsl(" + (h % 360) + " 55% 48%)";
}
function coin(asset) { return el("span", { class: "coin", style: "background:" + coinColor(asset) }, String(asset || "?").slice(0, 3)); }
function assetLabel(asset, extra) { return el("span", { class: "asset" }, coin(asset), asset || "?", extra || null); }
function routeLabel(t) { return el("span", { class: "route" }, el("span", { class: "muted" }, t.source_asset || "?"), el("span", { class: "arrow" }, "→"), assetLabel(t.destination_asset)); }
function table(head, rows, opts = {}) {
  return el("div", { class: "table-wrap" }, el("table", null,
    el("thead", null, el("tr", null, head.map(([label, cls]) => el("th", { class: cls || null }, label)))),
    el("tbody", null, rows)));
}
function seg(options, current, onPick) {
  return el("div", { class: "seg", role: "group" }, options.map(([value, label]) =>
    el("button", { type: "button", "aria-pressed": String(value === current), onclick: () => onPick(value) }, label)));
}

// ---------- tooltip ----------
const tipEl = document.getElementById("tip");
function showTip(evt, lines) {
  tipEl.replaceChildren(...lines.filter(Boolean).map((line, i) => el("div", { class: i === 0 ? "tt" : null }, line)));
  tipEl.hidden = false;
  const pad = 14, rect = tipEl.getBoundingClientRect();
  let x = evt.clientX + pad, y = evt.clientY + pad;
  if (x + rect.width > innerWidth - 8) x = evt.clientX - rect.width - pad;

      tip: [t.source_asset + " → " + t.destination_asset, usd(t.pnl_usdt, { sign: true }) + " (" + pct(t.pnl_pct) + ")" + (t.status === "open" ? " · open" : t.status === "cash" ? " · to cash" : ""), stamp(t.opened_at) + " · held " + duration(t.hold_seconds)] }));
  const perTrade = card("Result per trade", bars.length ? barChart(bars, { height: 200 }) : empty("No results yet", ""), { hint: "green win · red loss · blue open" });

  const days = new Map();
  for (const t of s.realized) {
    const t0 = ms(t.closed_at || t.opened_at);
    if (t0 === null) continue;
    const key = dayKey(t0);
    const d = days.get(key) || { pnl: 0, n: 0, t: t0 };
    d.pnl += num(t.pnl_usdt) || 0; d.n++;
    days.set(key, d);
  }
  const dayBars = [...days.entries()].sort(([a], [b]) => (a < b ? -1 : 1)).map(([, d]) => ({ y: d.pnl, label: shortDate(new Date(d.t).toISOString()),
    tip: [new Date(d.t).toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric" }), usd(d.pnl, { sign: true }), d.n + " trade" + (d.n === 1 ? "" : "s") + " closed"] }));
  const daily = card("Daily P&L", dayBars.length ? barChart(dayBars, { height: 200 }) : empty("No closed trades", ""));

  const mix = card("Outcomes", donut([
    { label: "Wins", value: s.wins.length, display: String(s.wins.length), color: "var(--pos)" },
    { label: "Losses", value: s.losses.length, display: String(s.losses.length), color: "var(--neg)" },
    { label: "Open", value: s.open.length, display: String(s.open.length), color: "var(--accent)" },
    { label: "To cash", value: trades.filter((t) => t.status === "cash").length, display: String(trades.filter((t) => t.status === "cash").length), color: "var(--c6)" },
  ], { center: s.winRate === null ? "—" : pct(s.winRate, { sign: false, dp: 0 }), sub: "win rate" }));

  return el("div", { class: "grid" }, head, kpis,
    el("div", { class: "grid split" }, equity, mix),
    el("div", { class: "grid halves" }, perTrade, daily),
    assetCard(trades),
    card("Trades", tradeTable([...trades].reverse(), { expandable: true }), { flush: true, hint: "click a row for Claude's reasoning" }),
    failedRoutesCard(history),
    el("details", { class: "footnote" }, el("summary", null, "How results are calculated"),
      el("p", null, "Each route Claude submits opens a trade in the coin it bought. The trade closes when Claude later sells that coin. Cost is the USDT value Claude gave up; the result is what the coins were worth when sold (or right now, if still held) minus that cost, so fees and spread are included and the trade results add up to the whole run. Values are the bot's USDT quotes at execution time, not exchange statements. Moves into stablecoins count toward net P&L but not toward wins and losses.")));
}
function assetCard(trades) {
  const groups = new Map();
  for (const t of trades) {
    if (!["win", "loss", "open"].includes(t.status)) continue;
    const g = groups.get(t.destination_asset) || { asset: t.destination_asset, n: 0, wins: 0, losses: 0, pnl: 0 };
    g.n++; g.pnl += num(t.pnl_usdt) || 0;
    if (t.status === "win") g.wins++; else if (t.status === "loss") g.losses++;
    groups.set(t.destination_asset, g);
  }
  const rows = [...groups.values()].sort((a, b) => b.pnl - a.pnl);
  if (!rows.length) return null;
  const maxAbs = Math.max(...rows.map((g) => Math.abs(g.pnl)), 1e-9);
  return card("By coin", table([["Coin"], ["Trades", "r"], ["Win rate", "r"], ["P&L", "r"]], rows.map((g) =>
    el("tr", null,
      el("td", null, assetLabel(g.asset)),
      el("td", { class: "r" }, String(g.n)),
      el("td", { class: "r" }, g.wins + g.losses ? pct((g.wins / (g.wins + g.losses)) * 100, { sign: false, dp: 0 }) : "—"),
      el("td", { class: "r" }, el("div", { class: "bar-cell" }, signed(g.pnl),
        el("div", { class: "bar-track" }, el("div", { class: "bar-fill " + tone(g.pnl), style: "width:" + Math.max(3, (Math.abs(g.pnl) / maxAbs) * 100) + "%" }))))))),
    { flush: true, hint: "which coins made or lost money" });
}
function tradeKey(t) { return t.opened_at + "|" + t.route_id; }
function tradeTable(trades, opts = {}) {

  const rows = [];

    const key = tradeKey(t);
    if (opts.compact) {
      rows.push(el("tr", null, el("td", null, routeLabel(t)), el("td", null, resultChip(t)),
        el("td", { class: "r" }, signed(t.pnl_usdt)), el("td", { class: "r muted", title: stamp(t.opened_at) }, ago(t.opened_at))));

      el("td", { class: "nw muted" }, stamp(t.opened_at)),
      el("td", null, routeLabel(t)),
      el("td", null, resultChip(t)),
      el("td", { class: "r" }, usd(t.cost_usdt)),

      el("td", { class: "r" }, el("span", { class: tone(t.pnl_pct) }, pct(t.pnl_pct))),
      el("td", { class: "r muted" }, usd(t.fees_usdt)),
      el("td", { class: "r muted" }, duration(t.hold_seconds) + (t.status === "open" ? "+" : ""))));
    if (open) {
      rows.push(el("tr", { class: "detail" }, el("td", { colspan: 8 }, el("div", { class: "grid", style: "gap:6px;padding:6px 0" },
        el("div", { class: "feed-text" }, t.reason || "No reasoning recorded for this route."),
        el("div", { class: "feed-meta" },
          el("span", null, "Closed " + (t.closed_at ? stamp(t.closed_at) : t.status === "open" ? "— still held" : "—")),
          el("span", { class: "sep" }, "·"), el("span", null, "Exit value " + usd(t.exit_usdt)),
          el("span", { class: "sep" }, "·"), el("span", null, t.legs + " order" + (t.legs === 1 ? "" : "s")),

function failedRoutesCard(history) {

}

      el("td", { class: "r" }, h.value_usdt === null ? el("span", { class: "faint", title: "no USDT market" }, "unpriced") : usd(h.value_usdt)),
      el("td", { class: "r" }, el("div", { class: "bar-cell" }, el("span", { class: "muted" }, pct(share, { sign: false, dp: 1 })),
        el("div", { class: "bar-track" }, el("div", { class: "bar-fill", style: "width:" + Math.max(share > 0 ? 2 : 0, share) + "%" })))));
  });
  if (hidden > 0) holdingRows.push(el("tr", null, el("td", { colspan: 6, class: "muted small" }, hidden + " small balance" + (hidden === 1 ? "" : "s") + " hidden (" + usd(hiddenValue) + " total)")));
  const holdings = card("Holdings", table([["Asset"], ["Amount", "r"], ["Price", "r"], ["24h", "r"], ["Value", "r"], ["Share", "r"]], holdingRows), { flush: true, action: toggle });

  const allocation = card("Allocation", allocationDonut(wallet));
  const wallets = card("Binance wallets", wallet.wallets_error ? errorBox(wallet.wallets_error) : wallet.wallets.length

    : empty("No balances", ""), { hint: "valued by Binance in USDT" });

    wallet.prices_error ? el("div", { class: "alert warn" }, el("div", null, el("b", null, "Prices incomplete"), el("span", null, wallet.prices_error))) : null,
    el("div", { class: "grid split", style: "align-items:start" }, holdings, el("div", { class: "grid", style: "align-content:start" }, allocation, wallets)),
    el("div", { class: "grid halves" }, securityCard(wallet), accountCard(wallet)));

function check(state, title, detail) {
  const icon = { pos: "✓", neg: "!", warn: "!", muted: "–" }[state];
  return el("div", { class: "check" }, el("span", { class: "ic " + state }, icon), el("div", null, el("div", { class: "t" }, title), el("div", { class: "d" }, detail)));

function securityCard(wallet) {

  const items = [
    k.enableWithdrawals ? check("neg", "Withdrawals are enabled", "Anyone with this key could move funds off Binance. Turn it off in API Management.")

    k.ipRestrict ? check("pos", "IP restricted", "The key only works from your whitelisted IPs.")

    k.enableSpotAndMarginTrading ? check("pos", "Spot trading enabled", "Claude Spot needs this to trade.")

  items.push(extras.length ? check("warn", extras.join(", ") + (extras.length === 1 ? " permission" : " permissions") + " on", "Not used while Claude Spot is the only live trader. Turning them off shrinks what a leaked key could do.")

// ---------- Claude ----------
function claudePage() {
  const st = ui.data.status;
  const head = pageHead("Claude", "What the trader is doing and why.", null);
  if (!st) return el("div", { class: "grid" }, head, ui.errors.status ? card(null, errorBox(ui.errors.status)) : loadingView());
  const state = claudeState();
  const agent = st.agent || {};
  const latest = st.cycles[0];
  const model = latest && latest.agent ? latest.agent.model : "";
  const traded = st.cycles.filter((c) => ["traded", "rebalance"].includes(((c.agent && c.agent.end_cycle && c.agent.end_cycle.action) || "").toLowerCase())).length;

  const kpis = el("div", { class: "grid kpis" },
    kpi("Status", state.label, state.detail, state.tone || null),
    kpi("Cycles", agent.cycle_count ? String(agent.cycle_count) : "0", latest ? "since the fresh start · last " + ago(latest.timestamp) : "since the fresh start"),

    kpi("LLM cost today", usd(agent.llm_cost_usd), model ? model.replace(/^.*\//, "") + (latest.agent.thinking ? " · " + latest.agent.thinking + " thinking" : "") : ""));

  const costBars = [...st.cycles].reverse().map((c) => {

    return { y: num(usage.cost_usd) || 0, tone: "accent", label: "",
      tip: [stamp(c.timestamp), usd(usage.cost_usd) + " · " + ((c.agent && c.agent.tool_calls) || []).length + " tool calls", (c.agent && c.agent.end_cycle ? pretty(c.agent.end_cycle.action) : "")] };
  });
  const cost = card("Cost per cycle", costBars.length ? barChart(costBars, { height: 150 }) : empty("No cycles yet", ""), { hint: "last " + costBars.length + " cycles" });

  const feed = card("Cycles", st.cycles.length ? el("div", { class: "feed" }, st.cycles.slice(0, 40).map((c) => {
    const a = c.agent || {}, usage = a.usage || {};

    const text = el("div", { class: "feed-text clamp", title: "click to expand", onclick: (e) => e.currentTarget.classList.toggle("clamp") }, summary || "No summary.");
    return el("div", { class: "feed-item" },
      el("div", { class: "feed-meta" }, actionChip(c), a.turn_status && a.turn_status !== "completed" ? chip(pretty(a.turn_status), "neg") : null,

        el("span", null, (a.tool_calls || []).length + " tools"), el("span", { class: "sep" }, "·"), el("span", null, usd(usage.cost_usd))),
      text, c.error ? el("div", { class: "small neg" }, c.error) : null);
  })) : empty("No cycles yet", "Claude's first cycle shows up within a few minutes of starting."), { flush: st.cycles.length > 0, hint: "newest first" });

  const journal = card("Journal", st.journal_error ? errorBox(st.journal_error) : st.journal.length
    ? el("div", { class: "feed" }, st.journal.slice(0, 30).map((j) => el("div", { class: "feed-item" },
      el("div", { class: "feed-meta" }, el("span", { title: stamp(j.timestamp) }, ago(j.timestamp))),
      el("div", { class: "feed-text clamp", onclick: (e) => e.currentTarget.classList.toggle("clamp") }, j.text))))
    : empty("Empty journal", "Claude writes its theses here so they survive restarts."), { flush: st.journal.length > 0, hint: "Claude's own notes" });

  return el("div", { class: "grid" }, head, kpis, cost, el("div", { class: "grid split" }, feed, journal));
}

// ---------- data loading ----------
async function load() {
  if (ui.loading) return;
  ui.loading = true;
  const button = document.getElementById("refresh");
  button.classList.add("spin");
  const keys = Object.keys(ENDPOINTS);
  const results = await Promise.allSettled(keys.map((k) => fetch(ENDPOINTS[k], { cache: "no-store" }).then((r) => {
    if (!r.ok) throw new Error("HTTP " + r.status);
    return r.json();
  })));
  results.forEach((r, i) => {
    if (r.status === "fulfilled") { ui.data[keys[i]] = r.value; delete ui.errors[keys[i]]; }
    else ui.errors[keys[i]] = r.reason && r.reason.message ? r.reason.message : String(r.reason);
  });
  ui.loadedAt = Date.now();
  ui.loading = false;
  button.classList.remove("spin");
  render();
}
function route() {
  const tab = location.hash.replace(/^#/, "");
  ui.tab = TABS.includes(tab) ? tab : "overview";
  render();
}
let resizeTimer = null;
addEventListener("resize", () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(drawCharts, 120); });
addEventListener("hashchange", () => { route(); scrollTo({ top: 0 }); });
document.addEventListener("visibilitychange", () => { if (!document.hidden && Date.now() - (ui.loadedAt || 0) > REFRESH_MS) load(); });
document.getElementById("refresh").addEventListener("click", load);
setInterval(() => { if (!document.hidden) load(); }, REFRESH_MS);
route();
load();
</script>
