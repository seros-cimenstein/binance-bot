<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="light dark">
<title>cryptobot</title>
<style>
  :root {
    --bg: #f5f6f8; --surface: #fff; --surface-2: #f1f3f6; --fg: #14171c; --muted: #687080; --faint: #9aa1ad;
    --border: #e4e7ec; --accent: #4f46e5; --accent-soft: rgba(79, 70, 229, .1);
    --pos: #12965a; --pos-soft: rgba(18, 150, 90, .12); --neg: #d9363e; --neg-soft: rgba(217, 54, 62, .11);
    --warn: #b7791f; --warn-soft: rgba(183, 121, 31, .13);
    --shadow: 0 1px 2px rgba(16, 24, 40, .04), 0 1px 3px rgba(16, 24, 40, .06);
    --c1: #4f46e5; --c2: #0ea5e9; --c3: #14b8a6; --c4: #f59e0b; --c5: #ec4899; --c6: #94a3b8;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0b0d12; --surface: #13161d; --surface-2: #1a1e27; --fg: #e7e9ee; --muted: #9198a5; --faint: #5f6673;
      --border: #242934; --accent: #8b93fb; --accent-soft: rgba(139, 147, 251, .14);
      --pos: #34d27b; --pos-soft: rgba(52, 210, 123, .13); --neg: #f87171; --neg-soft: rgba(248, 113, 113, .13);
      --warn: #fbbf24; --warn-soft: rgba(251, 191, 36, .13); --shadow: none;
      --c1: #8b93fb; --c2: #38bdf8; --c3: #2dd4bf; --c4: #fbbf24; --c5: #f472b6; --c6: #64748b;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--bg); color: var(--fg); font: 14px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
         -webkit-font-smoothing: antialiased; }
  button { font: inherit; color: inherit; }
  .num { font-variant-numeric: tabular-nums; }
  .muted { color: var(--muted); } .faint { color: var(--faint); }
  .pos { color: var(--pos); } .neg { color: var(--neg); } .warn { color: var(--warn); }
  .small { font-size: 12px; }

  /* top bar */
  .top { position: sticky; top: 0; z-index: 10; background: color-mix(in srgb, var(--bg) 85%, transparent);
         backdrop-filter: blur(10px); border-bottom: 1px solid var(--border); }
  .top-inner { max-width: 1240px; margin: 0 auto; padding: 0 20px; display: flex; align-items: center; gap: 20px; height: 56px; }
  .brand { display: flex; align-items: center; gap: 8px; font-weight: 650; letter-spacing: -.01em; white-space: nowrap; }
  .brand .mark { width: 22px; height: 22px; border-radius: 6px; background: linear-gradient(135deg, var(--accent), var(--c2)); }
  .tabs { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; flex: 1; }
  .tabs a { padding: 6px 12px; border-radius: 8px; color: var(--muted); text-decoration: none; font-weight: 500; white-space: nowrap; }
  .tabs a:hover { color: var(--fg); background: var(--surface-2); }
  .tabs a[aria-current="page"] { color: var(--fg); background: var(--surface); box-shadow: var(--shadow); outline: 1px solid var(--border); }
  .top-right { display: flex; align-items: center; gap: 12px; white-space: nowrap; }
  .icon-btn { border: 1px solid var(--border); background: var(--surface); border-radius: 8px; width: 32px; height: 32px; cursor: pointer;
              display: grid; place-items: center; color: var(--muted); }
  .icon-btn:hover { color: var(--fg); }
  .icon-btn.spin svg { animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .status { display: inline-flex; align-items: center; gap: 7px; padding: 4px 10px; border-radius: 999px; font-weight: 600; font-size: 12px;
            background: var(--surface-2); color: var(--muted); }
  .status .dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
  .status.pos { background: var(--pos-soft); color: var(--pos); }
  .status.pos .dot { box-shadow: 0 0 0 0 currentColor; animation: pulse 2s infinite; }
  .status.neg { background: var(--neg-soft); color: var(--neg); }
  .status.warn { background: var(--warn-soft); color: var(--warn); }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, currentColor 50%, transparent); } 70% { box-shadow: 0 0 0 6px transparent; } 100% { box-shadow: 0 0 0 0 transparent; } }

  main { max-width: 1240px; margin: 0 auto; padding: 20px; display: grid; gap: 16px; }
  .page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .page-head h1 { font-size: 20px; margin: 0; letter-spacing: -.02em; }
  .page-head p { margin: 2px 0 0; color: var(--muted); }

  .alerts { display: grid; gap: 8px; }
  .alert { display: flex; gap: 10px; align-items: flex-start; padding: 10px 14px; border-radius: 10px; border: 1px solid; }
  .alert.neg { background: var(--neg-soft); border-color: color-mix(in srgb, var(--neg) 35%, transparent); color: var(--neg); }
  .alert.warn { background: var(--warn-soft); border-color: color-mix(in srgb, var(--warn) 35%, transparent); color: var(--warn); }
  .alert b { display: block; }
  .alert span { color: var(--fg); opacity: .85; }

  .grid { display: grid; gap: 16px; }
  .kpis { grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); }
  .split { grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); }
  .halves { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  @media (max-width: 900px) { .split, .halves { grid-template-columns: minmax(0, 1fr); } }

  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; box-shadow: var(--shadow); min-width: 0; }
  .card-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 14px 16px 0; }
  .card-head h2 { margin: 0; font-size: 14px; font-weight: 600; }
  .card-head .hint { color: var(--muted); font-size: 12px; }
  .card-body { padding: 12px 16px 16px; }
  .card-body.flush { padding: 8px 0 4px; }

  .kpi { padding: 14px 16px; }
  .kpi .label { color: var(--muted); font-size: 12px; font-weight: 500; display: flex; align-items: center; gap: 6px; }
  .kpi .value { font-size: 26px; font-weight: 650; letter-spacing: -.02em; margin-top: 4px; line-height: 1.15; }
  .kpi .sub { color: var(--muted); font-size: 12px; margin-top: 4px; }
  .kpi .sub b { font-weight: 600; }

  .chip { display: inline-flex; align-items: center; gap: 5px; padding: 1px 8px; border-radius: 999px; font-size: 12px; font-weight: 600;
          background: var(--surface-2); color: var(--muted); white-space: nowrap; }
  .chip.pos { background: var(--pos-soft); color: var(--pos); }
  .chip.neg { background: var(--neg-soft); color: var(--neg); }
  .chip.warn { background: var(--warn-soft); color: var(--warn); }
  .chip.accent { background: var(--accent-soft); color: var(--accent); }

  .seg { display: inline-flex; background: var(--surface-2); border-radius: 9px; padding: 3px; gap: 2px; }
  .seg button { border: 0; background: transparent; padding: 4px 12px; border-radius: 7px; cursor: pointer; color: var(--muted); font-weight: 500; }
  .seg button[aria-pressed="true"] { background: var(--surface); color: var(--fg); box-shadow: var(--shadow); }

  .toggle { display: inline-flex; align-items: center; gap: 8px; color: var(--muted); font-size: 12px; cursor: pointer; user-select: none; }

  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 9px 16px; border-top: 1px solid var(--border); vertical-align: middle; }
  thead th { border-top: 0; color: var(--muted); font-weight: 500; font-size: 12px; white-space: nowrap; padding-top: 4px; padding-bottom: 6px; }
  td.r, th.r { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  td.nw { white-space: nowrap; }
  tr.click { cursor: pointer; }
  tr.click:hover td { background: var(--surface-2); }
  tr.detail td { background: var(--surface-2); border-top: 0; padding-top: 2px; }
  .table-wrap { overflow-x: auto; }
  .asset { display: inline-flex; align-items: center; gap: 8px; font-weight: 600; }
  .coin { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-size: 10px; font-weight: 700; color: #fff; flex: none; }
  .route { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
  .route .arrow { color: var(--faint); }
  .bar-cell { display: flex; align-items: center; gap: 8px; justify-content: flex-end; }
  .bar-track { width: 80px; height: 6px; border-radius: 3px; background: var(--surface-2); overflow: hidden; flex: none; }
  .bar-fill { height: 100%; border-radius: 3px; background: var(--accent); }
  .bar-fill.pos { background: var(--pos); } .bar-fill.neg { background: var(--neg); }

  .empty { padding: 28px 16px; text-align: center; color: var(--muted); }
  .empty b { display: block; color: var(--fg); font-weight: 600; margin-bottom: 2px; }
  .error-box { padding: 12px 16px; color: var(--neg); }

  .chart { width: 100%; min-height: 40px; }
  .chart svg { display: block; overflow: visible; }
  .chart .grid-line { stroke: var(--border); stroke-dasharray: 2 4; }
  .chart .zero { stroke: var(--faint); }
  .chart .axis { fill: var(--faint); font-size: 11px; }
  .chart .line { fill: none; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
  .chart .line.pos { stroke: var(--pos); } .chart .line.neg { stroke: var(--neg); }
  .chart .area.pos { fill: var(--pos-soft); } .chart .area.neg { fill: var(--neg-soft); }
  .chart .dot { stroke: var(--surface); stroke-width: 1.5; fill: var(--faint); }
  .chart .dot.pos { fill: var(--pos); } .chart .dot.neg { fill: var(--neg); } .chart .dot.accent { fill: var(--accent); }
  .chart .coin-tag { fill: var(--muted); font-size: 10px; font-weight: 600; pointer-events: none; }
  .chart .hold-band { opacity: .7; } .chart .hold-band.pos { fill: var(--pos-soft); } .chart .hold-band.neg { fill: var(--neg-soft); }
  .chart .hold-band.accent { fill: color-mix(in srgb, var(--accent) 14%, transparent); }
  .chart .hold-line { stroke-width: 2.5; stroke-linecap: round; }
  .chart .hold-line.pos { stroke: var(--pos); } .chart .hold-line.neg { stroke: var(--neg); } .chart .hold-line.accent { stroke: var(--accent); }
  .chart .cash-line { stroke: var(--faint); stroke-width: 1.5; stroke-dasharray: 4 4; }
  .chart .buy-dot { fill: var(--surface); stroke-width: 2; }
  .chart .buy-dot.pos { stroke: var(--pos); } .chart .buy-dot.neg { stroke: var(--neg); } .chart .buy-dot.accent { stroke: var(--accent); }
  .chart-legend { display: flex; flex-wrap: wrap; gap: 4px 16px; margin-top: 6px; font-size: 12px; color: var(--muted); }
  .chart-legend span { display: inline-flex; align-items: center; gap: 6px; }
  .chart-legend i { display: inline-block; }
  .chart-legend .lg-buy { width: 7px; height: 7px; border-radius: 50%; border: 2px solid var(--muted); }
  .chart-legend .lg-sell { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); }
  .chart-legend .lg-hold { width: 18px; height: 10px; border-radius: 2px; background: var(--pos-soft); border-bottom: 2.5px solid var(--pos); }
  .chart-legend .lg-cash { width: 18px; border-top: 1.5px dashed var(--faint); }
  .chart .bar.pos { fill: var(--pos); } .chart .bar.neg { fill: var(--neg); } .chart .bar.muted { fill: var(--faint); }
  .chart .bar.accent { fill: var(--accent); }
  .chart .bar:hover { opacity: .8; }
  .chart .guide { stroke: var(--faint); stroke-dasharray: 3 3; }
  .chart .line.accent { stroke: var(--accent); }
  .chart .line.exh { stroke: var(--warn); stroke-width: 1.5; stroke-dasharray: 5 3; }
  .chart .stage-mark { stroke: var(--c5); stroke-dasharray: 2 3; }
  .chart .stage-label { fill: var(--c5); font-size: 10px; font-weight: 600; }
  .chart .tier-line { stroke: var(--border); }
  .legend-inline { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
  .legend-inline .sw { display: inline-block; width: 14px; height: 3px; border-radius: 2px; vertical-align: middle; margin-right: 5px; }
  .token-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .token-head .val { margin-left: auto; font-variant-numeric: tabular-nums; color: var(--muted); font-size: 12px; }
  .take { display: grid; gap: 8px; border-top: 1px solid var(--border); padding-top: 10px; margin-top: 6px; }
  .take ul { margin: 0; padding-left: 18px; color: var(--muted); font-size: 12px; }

  .donut { display: flex; align-items: center; gap: 20px; flex-wrap: wrap; justify-content: center; }
  .donut svg circle.seg-arc { transition: stroke-width .15s; cursor: default; }
  .donut svg circle.seg-arc:hover { stroke-width: 22; }
  .legend { display: grid; gap: 6px; min-width: 150px; flex: 1; }
  .legend-row { display: flex; align-items: center; gap: 8px; font-size: 13px; }
  .legend-row .sw { width: 10px; height: 10px; border-radius: 3px; flex: none; }
  .legend-row .lv { margin-left: auto; font-variant-numeric: tabular-nums; color: var(--muted); }

  .checks { display: grid; gap: 2px; }
  .check { display: flex; gap: 12px; align-items: flex-start; padding: 10px 16px; border-top: 1px solid var(--border); }
  .check:first-child { border-top: 0; }
  .check .ic { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; flex: none; font-size: 13px; font-weight: 700; margin-top: 1px; }
  .check .ic.pos { background: var(--pos-soft); color: var(--pos); }
  .check .ic.neg { background: var(--neg-soft); color: var(--neg); }
  .check .ic.warn { background: var(--warn-soft); color: var(--warn); }
  .check .ic.muted { background: var(--surface-2); color: var(--muted); }
  .check .t { font-weight: 600; }
  .check .d { color: var(--muted); font-size: 12px; }

  .facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px 20px; }
  .fact .k { color: var(--muted); font-size: 12px; }
  .fact .v { font-weight: 600; margin-top: 1px; word-break: break-word; }

  .feed { display: grid; }
  .feed-item { padding: 12px 16px; border-top: 1px solid var(--border); display: grid; gap: 6px; }
  .feed-item:first-child { border-top: 0; }
  .feed-meta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
  .feed-meta .sep { color: var(--faint); }
  .feed-text { white-space: pre-wrap; word-break: break-word; }
  .clamp { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; cursor: pointer; }
  .more { border: 0; background: none; padding: 0; color: var(--accent); font-size: 12px; font-weight: 500; cursor: pointer; justify-self: start; }
  .more[hidden] { display: none; }
  .older { margin: 0; padding: 10px 16px; border: 0; border-top: 1px solid var(--border); background: none; width: 100%; text-align: center;
           color: var(--accent); font-weight: 500; cursor: pointer; }
  .older:hover { background: var(--surface-2); }

  .quote { padding: 14px 16px; border-left: 3px solid var(--accent); background: var(--accent-soft); border-radius: 0 10px 10px 0;
           white-space: pre-wrap; word-break: break-word; }

  .footnote { color: var(--muted); font-size: 12px; }
  details.footnote summary { cursor: pointer; color: var(--accent); }
  details.footnote p { margin: 6px 0 0; max-width: 820px; }

  .feed-item.click { cursor: pointer; }
  .feed-item.click:hover { background: var(--surface-2); }
  .feed-item.click .cycle-detail { cursor: auto; }
  .cycle-detail { display: grid; gap: 12px; padding: 12px; border-radius: 10px; background: var(--surface-2); }
  .cycle-detail .facts { grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); }
  .tool-list { display: grid; gap: 3px; font-size: 12px; }
  .tool-row { display: grid; grid-template-columns: 18px minmax(110px, max-content) minmax(0, 1fr) auto; gap: 10px; align-items: baseline; }
  .tool-row .args { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tool-row.click { cursor: pointer; }
  .tool-row.click:hover .args { color: var(--fg); }
  .tool-row.open .args { white-space: pre-wrap; word-break: break-word; overflow: visible; color: var(--fg); }
  .code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .rules { margin: 0; padding-left: 18px; }
  .ladder { position: relative; height: 52px; margin: 2px 8px; }
  .ladder-track { position: absolute; left: 0; right: 0; top: 22px; height: 4px; border-radius: 2px; background: var(--surface-2); }
  .ladder-mark { position: absolute; top: 16px; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 2px;
                 font-size: 11px; font-weight: 600; color: var(--muted); white-space: nowrap; }
  .ladder-mark.up { top: 0; flex-direction: column-reverse; }
  .ladder-mark::before { content: ""; width: 3px; height: 16px; border-radius: 2px; background: currentColor; }
  .ladder-mark.neg { color: var(--neg); } .ladder-mark.pos { color: var(--pos); } .ladder-mark.accent { color: var(--accent); }

  .tip { position: fixed; z-index: 50; pointer-events: none; background: var(--fg); color: var(--bg); padding: 7px 10px; border-radius: 8px;
         font-size: 12px; max-width: 280px; box-shadow: 0 6px 20px rgba(0, 0, 0, .18); }
  .tip .tt { font-weight: 650; margin-bottom: 2px; }
  .skeleton { height: 120px; border-radius: 14px; background: linear-gradient(90deg, var(--surface) 0%, var(--surface-2) 50%, var(--surface) 100%);
              background-size: 200% 100%; animation: shimmer 1.4s infinite; border: 1px solid var(--border); }
  @keyframes shimmer { to { background-position: -200% 0; } }
  @media (max-width: 640px) {
    .top-inner { flex-wrap: wrap; height: auto; gap: 6px 10px; padding: 8px 12px 0; }
    .tabs { order: 3; flex-basis: 100%; padding-bottom: 8px; }
    .top-right { margin-left: auto; }
    #updated { display: none; }
    main { padding: 14px 12px; }
    th, td { padding: 8px 10px; }
    .kpi .value { font-size: 22px; }
  }
</style>
</head>
<body>
<header class="top">
  <div class="top-inner">
    <div class="brand"><span class="mark"></span><span class="name">cryptobot</span></div>
    <nav class="tabs" id="tabs">
      <a href="#overview" data-tab="overview">Overview</a>
      <a href="#history" data-tab="history">History</a>
      <a href="#wallet" data-tab="wallet">Wallet</a>
      <a href="#bot" data-tab="bot">Bot</a>
      <a href="#exits" data-tab="exits">Exits</a>
      <a href="#fleet" data-tab="fleet">Fleet</a>
      <a href="#signals" data-tab="signals">Signals</a>
    </nav>
    <div class="top-right">
      <span class="status" id="status-pill" title=""><span class="dot"></span><span>…</span></span>
      <span class="small faint" id="updated"></span>
      <button class="icon-btn" id="refresh" type="button" title="Refresh now" aria-label="Refresh now">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
      </button>
    </div>
  </div>
</header>
<main id="view"></main>
<div class="tip" id="tip" hidden></div>
<script>
"use strict";
// Everything that comes from the bot (including Claude- and web-derived text) is inserted with
// textContent / createTextNode; nothing is parsed as HTML.
const REFRESH_MS = 30000;
const DUST_USDT = 1;
const TABS = ["overview", "history", "wallet", "bot", "exits", "fleet", "signals"];
const ENDPOINTS = { status: "/api/status", history: "/api/history", wallet: "/api/wallet", fleet: "/api/fleet", exits: "/api/exits", signals: "/api/signals" };
const SVGNS = "http://www.w3.org/2000/svg";
const PALETTE = ["var(--c1)", "var(--c2)", "var(--c3)", "var(--c4)", "var(--c5)", "var(--c6)"];

const ui = { tab: "overview", range: "all", hideDust: true, expanded: new Set(), shown: {}, pendingRender: false, data: {}, errors: {}, loadedAt: null, loading: false };

// ---------- DOM helpers ----------
function el(tag, attrs, ...kids) {
  const node = document.createElement(tag);
  for (const [key, value] of Object.entries(attrs || {})) {
    if (value === null || value === undefined || value === false) continue;
    if (key.startsWith("on")) node.addEventListener(key.slice(2), value);
    else if (key === "class") node.className = value;
    else node.setAttribute(key, value === true ? "" : value);
  }
  append(node, kids);
  return node;
}
function append(node, kids) {
  for (const kid of kids.flat(Infinity)) {
    if (kid === null || kid === undefined || kid === false) continue;
    node.append(kid instanceof Node ? kid : document.createTextNode(String(kid)));
  }
}
function sv(tag, attrs, ...kids) {
  const node = document.createElementNS(SVGNS, tag);
  for (const [key, value] of Object.entries(attrs || {})) {
    if (value === null || value === undefined) continue;
    node.setAttribute(key, value);
  }
  for (const kid of kids.flat()) {
    if (kid === null || kid === undefined) continue;
    if (kid instanceof Node) node.append(kid); else node.textContent = String(kid);
  }
  return node;
}

// ---------- formatting ----------
const fmtCache = new Map();
function nf(min, max) {
  const key = min + ":" + max;
  if (!fmtCache.has(key)) fmtCache.set(key, new Intl.NumberFormat(undefined, { minimumFractionDigits: min, maximumFractionDigits: max }));
  return fmtCache.get(key);
}
function num(v) { const n = typeof v === "number" ? v : parseFloat(v); return Number.isFinite(n) ? n : null; }
function usd(v, opts = {}) {
  const n = num(v);
  if (n === null) return "—";

    el("span", null, el("span", { class: "sw", style: "background:var(--warn)" }), "exhaustion (0-1, scale-out 0.4/0.7)"),
    el("span", null, el("span", { class: "sw", style: "background:var(--c5)" }), "stage change"));
  const tokens = d.tokens.length ? el("div", { class: "grid halves" }, d.tokens.map((t) => tokenCard(t, now)))
    : card(null, empty("No focus or hot tokens", d.tokens_message || ""));

  const signals = card("Recent signals", d.signals.length ? signalsTable(d.signals) : empty("No signals yet", d.signals_message || ""),
    { flush: d.signals.length > 0, hint: "newest " + d.signals.length + " · a signal is a token's first hot cycle" });

  const reportBody = d.report_error ? card("Weekly report", errorBox(d.report_error))
    : !report ? card("Weekly report", empty("No weekly report yet", d.report_message || ""))
    : el("div", { class: "grid", style: "gap:16px" },
      el("div", { class: "page-head" }, el("div", null, el("h1", { style: "font-size:16px" }, "Weekly report · " + (report.date || "—")),
        el("p", null, "Generated " + stamp(isoMs(report.generated_at_ms)) + " · freeze date " + (report.freeze_date || "not set (burn-in)") + (report.markdown_path ? " · " + report.markdown_path : "")))),
      ["binance", "solana"].map((k) => venueReport(k, (report.venues || {})[k])));

  return el("div", { class: "grid" }, head, kpis, el("div", { class: "grid split", style: "align-items:start" }, collector, focusCard),
    el("div", { class: "page-head" }, el("div", null, el("h1", { style: "font-size:16px" }, "Traction · last 6h"), el("p", null, "Focus/hot tokens with the latest Haiku take.")), legend),
    tokens, signals, reportBody,
    el("details", { class: "footnote" }, el("summary", null, "What this shows"),
      el("p", null, "Paper evaluation of X chatter as a pre-pump signal (docs/signals/x-insighter-design.md). Traction scores X activity per token; a signal is a token's first hot cycle. Exhaustion flags drive simulated scale-out exits. The gate must pass on a venue before execution can even be proposed; nothing here places orders.")));
}

// ---------- data loading ----------
async function load() {
  if (ui.loading) return;
  ui.loading = true;
  const button = document.getElementById("refresh");
  button.classList.add("spin");
  const keys = Object.keys(ENDPOINTS);
  // The fleet view reads every bot's ledgers and takes seconds; on the first load each
  // section renders as soon as its own data arrives instead of waiting for the slowest.
  const results = await Promise.allSettled(keys.map((k) => fetch(ENDPOINTS[k], { cache: "no-store" }).then((r) => {
    if (!r.ok) throw new Error("HTTP " + r.status);
    return r.json();
  }).then((value) => {
    if (!(k in ui.data)) { ui.data[k] = value; render(); }
    return value;
  })));
  results.forEach((r, i) => {
    if (r.status === "fulfilled") { ui.data[keys[i]] = r.value; delete ui.errors[keys[i]]; }
    else ui.errors[keys[i]] = r.reason && r.reason.message ? r.reason.message : String(r.reason);
  });
  ui.loadedAt = Date.now();
  ui.loading = false;
  button.classList.remove("spin");
  refreshView();
}
function route() {
  const tab = location.hash.replace(/^#/, "");
  ui.tab = TABS.includes(tab) ? tab : "overview";
  render();
}
let resizeTimer = null;
addEventListener("resize", () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(() => { drawCharts(); markOverflow(); }, 120); });
addEventListener("hashchange", () => { route(); scrollTo({ top: 0 }); });
document.addEventListener("visibilitychange", () => { if (!document.hidden && Date.now() - (ui.loadedAt || 0) > REFRESH_MS) load(); });
document.getElementById("refresh").addEventListener("click", load);
setInterval(() => { if (!document.hidden) load(); }, REFRESH_MS);
route();
load();
</script>
</body>
