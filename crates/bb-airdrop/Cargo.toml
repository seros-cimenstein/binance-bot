[package]
name = "bb-airdrop"
description = "Airdrop farming: encrypted multi-chain wallet store, curated catalog, weekly checklist and Telegram reminder."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
bb-core.workspace = true
tokio.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
rust_decimal.workspace = true
rust_decimal_macros.workspace = true
chrono.workspace = true
thiserror.workspace = true
anyhow.workspace = true
tracing.workspace = true
clap.workspace = true
hmac.workspace = true
sha2.workspace = true
base64.workspace = true
bs58.workspace = true
ed25519-dalek.workspace = true
rand.workspace = true
html-escape.workspace = true
# Not in [workspace.dependencies]: EVM keys (secp256k1 + keccak), PBKDF2, TTY prompt, secret wiping.
k256 = { version = "0.13", default-features = false, features = ["arithmetic", "std"] }
sha3 = "0.10"
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
rpassword = "7"
zeroize = "1"

[dev-dependencies]
tempfile.workspace = true
wiremock.workspace = true
pretty_assertions.workspace = true
