# docker-compose.yml — Binance Bot Spot trader (Rust `bb` binary)
#
# Every long-running runtime is a container running one `bb <command>`.
# Periodic jobs (the Bot Spot data backup) run in the `scheduler` container via
# supercronic (docker/crontab). Bot Spot is the only trader.
#
# Layout:
#   - The `bb` binary and the dashboard are baked into the image.
#   - /app/data     <- bind-mounted host state dir; relative paths in the env file
#                      (e.g. BOT_SPOT_AUDIT_PATH=data/...) resolve against /app.
#   - /app/backups  <- bind-mounted backups dir
#   - env_file      <- BOT_ENV_FILE, defaults to ./.env.docker
#
# Profiles:
#   live       -> Bot Spot trader + dashboard + scheduler
#   all        -> same as live (deploy/seref/binance-bot-compose.service runs --profile all)
#   gui        -> cryptobot-gui read-only dashboard only
#   algo-paper -> bot-spot-algo-paper: the Phase 51 rule-based decider, plan-only (no orders)
#

x-base: &base
  image: binance-bot:latest
  build:
    context: .
    dockerfile: Dockerfile
  restart: unless-stopped
  env_file:
    - ${BOT_ENV_FILE:-./.env.docker}
  volumes:
    - ${BOT_DATA_DIR:-./docker-data}:/app/data
    - ${BOT_BACKUP_DIR:-./docker-backups}:/app/backups
  # DNS: containers use the Docker daemon's resolvers, i.e. the host's (/etc/resolv.conf).
  # Do not pin public resolvers here: some networks (the Pi's current one) block outbound
  # DNS to 1.1.1.1/8.8.8.8, which breaks every lookup. To pin, set "dns" in
  # /etc/docker/daemon.json to resolvers reachable from the current network.
  environment:
    TZ: UTC
    BINANCE_BOT_BACKUP_DIR: /app/backups
    BINANCE_BOT_PROJECT_DIR: /app
  stop_grace_period: 60s
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"

services:

  # ---------- LIVE ----------

  # The nonstop algorithm trader (needs BOT_SPOT_ALGO_WEIGHTS): polls prices every 15 s and
  # writes a decision row when the decided action changes, plus one an hour.
  # Live submission still requires BOT_SPOT_ENABLED=true, BOT_SPOT_DYNAMIC_SCOPE=all_eligible_spot,
  # USE_TESTNET=false, DRY_RUN=false, CONFIRM_LIVE_TRADING=yes. Emergency stop: touch data/bot-spot.stop.
  bot-spot:
    <<: *base
    container_name: bot-spot
    profiles: ["live", "all"]
    command: ["bb", "bot-spot", "--submit-live", "--nonstop"]

  # Practice run of the nonstop trader: plan-only, so it records `planned` routes and places
  # no order. Its own audit, state and lock; the emergency stop file is shared, so
  # data/bot-spot.stop stops it too. Needs BOT_SPOT_ALGO_WEIGHTS in the env file. Plan-only
  # decisions do not move the wallet: it keeps deciding on the real balances.
  bot-spot-algo-paper:
    <<: *base
    container_name: bot-spot-algo-paper
    profiles: ["algo-paper"]
    environment:
      TZ: UTC
      BINANCE_BOT_BACKUP_DIR: /app/backups
      BINANCE_BOT_PROJECT_DIR: /app
      BOT_SPOT_AUDIT_PATH: /app/data/bot-spot-algo-paper-decisions.jsonl
      BOT_SPOT_STATE_PATH: /app/data/bot-spot-algo-paper-state.json
      BOT_SPOT_LOCK_PATH: /app/data/bot-spot-algo-paper.lock
    command: ["bb", "bot-spot", "--plan-only", "--nonstop"]

  # ---------- DASHBOARD ----------

  # Read-only web dashboard. Published on the host's loopback only and mounts the data
  # dir read-only: open http://localhost:8787 on the host, or from another machine
  # tunnel it with `ssh -L 8787:localhost:8787 <host>`.
  cryptobot-gui:
    <<: *base
    container_name: cryptobot-gui
    profiles: ["gui", "live", "all"]
    volumes:
      - ${BOT_DATA_DIR:-./docker-data}:/app/data:ro
    environment:
      TZ: UTC
      # Inside the container only; the published port below stays on 127.0.0.1.
      CRYPTOBOT_GUI_BIND: 0.0.0.0:8787
    ports:
      - "127.0.0.1:${CRYPTOBOT_GUI_PORT:-8787}:8787"
    command: ["cryptobot-gui"]

  # ---------- SCHEDULER (periodic jobs) ----------

  scheduler:
    <<: *base
    container_name: scheduler
    profiles: ["live", "all"]
    command: ["/usr/local/bin/supercronic", "-passthrough-logs", "/app/docker/crontab"]
