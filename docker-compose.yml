# docker-compose.yml — Binance bot fleet
#
# Each long-running systemd unit in deploy/user/ becomes a container here.
# Periodic units (funding-arb, listing-detector, trend-filter, airdrop, backups)
# are consolidated into the `scheduler` container via supercronic.
#
# Layout:
#   - Code is baked into the image.
#   - /app/data     <- bind-mounted host state dir (was ~/.local/share/binance-bot/data)
#                     mounted at /app/data so relative paths in .env (e.g. DB_PATH=data/live.db) just work
#   - /app/backups  <- bind-mounted backups dir
#   - env_file      <- BOT_ENV_FILE, defaults to ./.env.docker
#
# Profiles:
#   paper         -> all paper/research workloads + scheduler
#   all           -> paper + scheduler  (no standalone live container today;
#                    live work runs as cron jobs inside scheduler)
#   claude-spot   -> opt-in Claude autonomous router (currently inert)
#   main-bot      -> legacy SMA bot (disabled in production)

x-base: &base
  image: binance-bot:latest
  build:
    context: .
    dockerfile: Dockerfile
  restart: unless-stopped
  env_file:
    - ${BOT_ENV_FILE:-./.env.docker}
  volumes:
    - ${BOT_DATA_DIR:-./docker-data}:/app/data
    - ${BOT_BACKUP_DIR:-./docker-backups}:/app/backups
  # Pin DNS to public resolvers — bypasses host router which times out
  # under aiodns load (sniper-paper hammers Solana/Jupiter endpoints).
  dns:
    - 1.1.1.1
    - 8.8.8.8
  environment:
    TZ: UTC
    BINANCE_BOT_BACKUP_DIR: /app/backups
    BINANCE_BOT_PROJECT_DIR: /app
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"

services:

  # ---------- PAPER ----------

  mean-reversion-paper:
    <<: *base
    container_name: mean-reversion-paper
    profiles: ["paper", "all"]
    command: ["python", "-m", "src.mean_reversion", "--paper", "--daemon"]

  pool-paper:
    <<: *base
    container_name: pool-paper
    profiles: ["paper", "all"]
    environment:
      TZ: UTC
      POOL_MODE: paper
    command: ["python", "-m", "src.pool"]

  sniper-paper:
    <<: *base
    container_name: sniper-paper
    profiles: ["paper", "all"]
    command:
      - "python"
      - "-m"
      - "src.sniper.paper"
      - "--entry-sol"
      - "0.005"
      - "--hold-seconds"
      - "300"
      - "--slippage-bps"
      - "500"
      - "--max-concurrent"
      - "5"
      - "--ledger-path"
      - "/app/data/sniper-paper-ledger.jsonl"
      - "--summary-path"
      - "/app/data/sniper-paper-summary.json"

  signals-dexscreener:
    <<: *base
    container_name: signals-dexscreener
    profiles: ["paper", "all"]
    command: ["python", "-m", "src.signals.dexscreener", "--daemon"]

  signals-telegram:
    <<: *base
    container_name: signals-telegram
    profiles: ["paper", "all"]
    command: ["python", "-m", "src.signals.telegram_ingester", "--daemon"]

  # ---------- DISABLED / OPT-IN ----------

  claude-spot:
    <<: *base
    container_name: claude-spot
    profiles: ["claude-spot"]
    command: ["python", "-m", "src.claude_spot", "--submit-live"]

  main-bot:
    <<: *base
    container_name: main-bot
    profiles: ["main-bot"]
    command: ["python", "-m", "src.main"]

  # ---------- SCHEDULER (periodic jobs) ----------

  scheduler:
    <<: *base
    container_name: scheduler
    profiles: ["paper", "live", "all"]
    command: ["/usr/local/bin/supercronic", "-passthrough-logs", "/app/docker/crontab"]
