[project]
name = "x-camoufox-collector"
version = "0.1.0"
description = "Phase 43 read-only X collector (Camoufox) for the binance-bot X insighter. Paper only."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "camoufox[geoip]==0.5.8",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[project.scripts]
x-collector = "x_collector.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/x_collector"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "I"]
